name: Ry Build (TV)

# Personal build of Nuvio + IPTV for RzshStyle. Builds the TV app on every push to ry/plus and
# publishes it as the public release "plus-tv-test". Uses Nuvio's published public client key
# (nuvio.tv/docs/server-api) so Nuvio account sign-in works. Optional secrets add extras.
on:
  push:
    branches: ['ry/plus', 'ry/modes']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ry-build-tv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: vpn-android/native/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Write app keys
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          : > keys.properties
          add() { if [ -n "$2" ]; then echo "$1=$2" >> keys.properties; fi; }
          add NUVIO_SUPABASE_URL "https://api.nuvio.tv"
          add NUVIO_SUPABASE_ANON_KEY "sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN"
          add TMDB_API_KEY "$TMDB_API_KEY"
          add TRAKT_CLIENT_ID "$TRAKT_CLIENT_ID"
          add TRAKT_CLIENT_SECRET "$TRAKT_CLIENT_SECRET"
          add INTRODB_API_URL "https://api.introdb.app/"
          cp keys.properties local.properties
          cp keys.properties local.dev.properties
          rm keys.properties
          echo "Keys set:"; cut -d= -f1 local.properties

      - name: Signing (the project's public fork keystore)
        run: |
          cp keystore/livetv-fork.jks "$RUNNER_TEMP/key.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/key.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=livetvfork"
            echo "NUVIO_RELEASE_STORE_PASSWORD=livetvfork"
          } >> "$GITHUB_ENV"

      - name: Version
        # A version the in-app updater can compare: Nuvio's base ("1.2.0-beta.4") becomes
        # "1.2.0-ry.<run>+beta.4", so every new run is newer than the last.
        run: |
          base=$(grep -m1 -E '^\s*versionName = "' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          core=${base%%-*}; core=${core%%+*}
          pre=${base#"$core"}; pre=${pre#-}; pre=${pre%%+*}
          name="${core}-ry.${{ github.run_number }}${pre:++$pre}"
          echo "RY_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "Version: $name"

      - name: Build APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleFullRelease --stacktrace --console=plain \
            -PlivetvBuildNumber=${{ github.run_number }} \
            -PlivetvVersionName="$RY_VERSION_NAME" \
            -PryUpdateUrl="https://github.com/${GITHUB_REPOSITORY}/releases/download/plus-tv-test/version.json" 2>&1 | tee build.log

      - name: Publish build log to ry/ci-logs
        if: always()
        run: |
          mkdir -p /tmp/logs && tail -n 400 build.log > /tmp/logs/tv-build-tail.log 2>/dev/null || true
          grep -nE '^e: |error:|FAILURE|What went wrong' -A3 build.log | head -200 > /tmp/logs/tv-errors.log 2>/dev/null || true
          cd /tmp/logs
          git init -q && git checkout -q -b ry/ci-logs
          git -c user.name=ci -c user.email=ci@localhost add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "logs ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ry/ci-logs

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(find app/build/outputs/apk/full/release -name "*universal*.apk" | head -n 1)
          [ -n "$src" ] || src=$(find app/build/outputs/apk/full/release -name "*.apk" | head -n 1)
          ls -la app/build/outputs/apk/full/release
          cp "$src" NuvioPlus-TV.apk
          # A smaller 32-bit ARM APK for sticks that only run 32-bit apps (Chromecast with Google TV).
          src32=$(find app/build/outputs/apk/full/release -name "*armeabi-v7a*.apk" | head -n 1)
          [ -n "$src32" ] && cp "$src32" NuvioPlus-TV-arm32.apk
          # The version file the app checks on launch to find this build (see UpdateRepository).
          # Same formula as app/build.gradle.kts: Nuvio's code x 100 + the run number.
          code=$(( $(grep -m1 -E '^\s*versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+') * 100 + ${{ github.run_number }} ))
          jq -n --arg name "$RY_VERSION_NAME" --argjson code "$code" \
            --arg notes "$(git log -1 --format=%s) (built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7})" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/plus-tv-test/NuvioPlus-TV.apk" \
            --arg release "https://github.com/${GITHUB_REPOSITORY}/releases/tag/plus-tv-test" \
            --arg sha "$(sha256sum NuvioPlus-TV.apk | cut -d' ' -f1)" \
            --argjson size "$(stat -c%s NuvioPlus-TV.apk)" \
            '{versionName: $name, versionCode: $code, notes: $notes, releaseUrl: $release,
              apk: {name: "NuvioPlus-TV.apk", url: $url, size: $size, sha256: $sha}}' > version.json
          if [ -f NuvioPlus-TV-arm32.apk ]; then
            jq --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/plus-tv-test/NuvioPlus-TV-arm32.apk" \
              --arg sha "$(sha256sum NuvioPlus-TV-arm32.apk | cut -d' ' -f1)" \
              --argjson size "$(stat -c%s NuvioPlus-TV-arm32.apk)" \
              '. + {apk32: {name: "NuvioPlus-TV-arm32.apk", url: $url, size: $size, sha256: $sha}}' version.json > v.tmp && mv v.tmp version.json
          fi
          cat version.json
          gh release delete plus-tv-test --yes --cleanup-tag 2>/dev/null || true
          gh release create plus-tv-test NuvioPlus-TV.apk $( [ -f NuvioPlus-TV-arm32.apk ] && echo NuvioPlus-TV-arm32.apk ) version.json --prerelease --target "$GITHUB_SHA" \
            --title "Nuvio + IPTV (Ry) TV build $RY_VERSION_NAME" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Download NuvioPlus-TV.apk and install it on your TV."
